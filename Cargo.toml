[package]
name = "bak"
authors = ["ChanceNCounter <ChanceNCounter@icloud.com>"]
repository = "https://github.com/bakfile/bak"
version = "0.3.0" # tracks version of `bak` binary, not underlying `bakfile` library
edition = "2021"

[[bin]]
name = "bak"
path = "src/bin/bak/main.rs"

[dependencies]
bakfile = {path = "src/lib"}

anyhow = "1.0.94"
clap = { version = "4.5.23", features = ["cargo"] }
log = "0.4.22"
semver = { version = "1.0.23", features = ["serde"] }
