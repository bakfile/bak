[package]
name = "bakfile"
authors = ["ChanceNCounter <ChanceNCounter@icloud.com>"]
repository = "https://github.com/bakfile/bak"
version = "0.1.0" # tracks version of `bakfile` library, not `bak` binary
edition = "2021"

[lib]
path = "lib.rs"

[dependencies]
clap = { version = "4.5.4", features = ["cargo"] }
chrono = "0.4.38"
directories = "5.0.1"
log = "0.4.21"
rusqlite = "0.31.0"
semver = { version = "1.0.23", features = ["serde"] }
serde = { version = "1.0.201", features = ["derive"] }
shellexpand = "3.1.0"
toml = "0.8.12"
thiserror = "1.0.61"
